# One port serves the game, health endpoint and WebSocket.
server.port=${PORT:3000}
server.address=${HOST:127.0.0.1}
# Commands run from the repository root. Every path can be overridden in deployment.
coincard.client-dist=${COINCARD_CLIENT_DIST:${user.dir}/client/dist}
spring.web.resources.static-locations=file:${coincard.client-dist}/
coincard.db-url=jdbc:sqlite:${COINCARD_DB_PATH:${user.dir}/data/coincard.db}
coincard.cards-path=${COINCARD_CARDS_PATH:${user.dir}/data/cards.json}

# Same ports as the Node server: single port serves game + API + WebSocket.
server.port=${PORT:3000}
server.address=${HOST:127.0.0.1}
# React production build (relative to server-java working directory).
spring.web.resources.static-locations=file:../client/dist/
# SQLite file (Prisma-format DATABASE_URL from server/.env is also accepted).
coincard.db-url=jdbc:sqlite:../data/coincard.db
coincard.cards-path=../data/cards.json
